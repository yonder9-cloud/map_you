<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나를 위한 건강지도 · 체질 자가 진단</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1C1A17;--ink-mid:#4A4540;--ink-light:#8A7E74;--ink-faint:#BDB3A8;
  --paper:#F7F3EC;--paper-mid:#EDE6D8;--paper-dark:#D8CEBC;
  --sage:#5C7C5E;--sage-light:#8EAD8E;--sage-pale:#D6E6D6;
  --rust:#9E5A3A;--rust-light:#C4845C;--rust-pale:#F0DDD4;
  --cobalt:#3A5A8A;--cobalt-light:#6A8AB8;--cobalt-pale:#D4DFF0;
  --gold:#8A7040;--gold-light:#B89A60;--gold-pale:#EDE0C4;
  --r:20px;
}
html,body{width:100%;min-height:100vh;background:var(--paper);font-family:'Noto Sans KR',sans-serif;color:var(--ink)}

/* ── 헤더 ── */
#hdr{
  position:sticky;top:0;z-index:100;
  background:rgba(247,243,236,0.96);
  border-bottom:1px solid var(--paper-dark);
  backdrop-filter:blur(10px);
  padding:0 24px;
}
.hdr-inner{max-width:780px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{font-family:'Noto Serif KR',serif;font-size:15px;font-weight:600;color:var(--sage);letter-spacing:.5px}
.logo span{color:var(--ink-light);font-weight:300;font-size:12px;margin-left:8px}
.pbar-w{position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--paper-dark)}
.pbar-f{height:100%;background:linear-gradient(90deg,var(--sage),var(--sage-light));transition:width .5s ease;border-radius:0 2px 2px 0}

/* ── 레이아웃 ── */
.page{min-height:calc(100vh - 56px);display:flex;justify-content:center;align-items:flex-start;padding:32px 20px 64px}
.inner{width:100%;max-width:680px}

/* ── 카드 기본 ── */
.card{background:#fff;border:1px solid var(--paper-dark);border-radius:var(--r);overflow:hidden;animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ── 시작 화면 ── */
.start-hero{padding:52px 44px 32px;text-align:center;border-bottom:1px solid var(--paper-mid)}
.start-eye{font-size:11px;letter-spacing:3px;color:var(--sage);margin-bottom:14px;font-weight:500}
.start-t{font-family:'Noto Serif KR',serif;font-size:32px;font-weight:600;color:var(--ink);line-height:1.35;margin-bottom:16px}
.start-d{font-size:13px;color:var(--ink-light);line-height:1.9;max-width:380px;margin:0 auto 28px}
.tag-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:36px}
.tag{font-size:11px;padding:5px 13px;border-radius:20px;letter-spacing:.5px}
.tag-g{background:var(--sage-pale);color:var(--sage)}
.tag-r{background:var(--rust-pale);color:var(--rust)}
.tag-b{background:var(--cobalt-pale);color:var(--cobalt)}
.tag-o{background:var(--gold-pale);color:var(--gold)}
.start-body{padding:28px 44px 36px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:28px}
.info-cell{background:var(--paper);border-radius:12px;padding:16px;text-align:center}
.ic-l{font-size:10px;color:var(--ink-faint);letter-spacing:1px;margin-bottom:6px}
.ic-v{font-size:15px;font-weight:600;color:var(--ink-mid)}

/* 성별 선택 */
.gender-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.gbtn{background:var(--paper);border:1.5px solid var(--paper-dark);border-radius:14px;padding:22px 16px;font-size:15px;cursor:pointer;text-align:center;color:var(--ink-mid);transition:all .2s;font-family:'Noto Sans KR',sans-serif}
.gbtn:hover,.gbtn.sel{border-color:var(--sage);background:var(--sage-pale);color:var(--sage)}
.gbtn-ico{font-size:26px;margin-bottom:8px}
.gbtn-sub{font-size:10px;color:var(--ink-faint);margin-top:4px}

.btn-start{width:100%;background:var(--ink);border:none;border-radius:12px;padding:17px;font-size:15px;color:#fff;cursor:pointer;font-family:'Noto Serif KR',serif;font-weight:600;letter-spacing:1px;transition:background .2s}
.btn-start:hover{background:var(--sage)}
.btn-start:disabled{background:var(--paper-dark);color:var(--ink-faint);cursor:not-allowed}
.disc{font-size:11px;color:var(--ink-faint);text-align:center;margin-top:12px;line-height:1.7}

/* ── 문항 ── */
.sec-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sec-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sec-name{font-size:11px;letter-spacing:1.5px;font-weight:500}
.sec-desc{font-size:11px;color:var(--ink-faint)}

.q-wrap{padding:36px 40px}
.q-phase{font-size:10px;letter-spacing:2px;color:var(--ink-faint);margin-bottom:4px}
.q-num{font-size:11px;color:var(--ink-faint);margin-bottom:10px}
.q-text{font-family:'Noto Serif KR',serif;font-size:20px;line-height:1.75;color:var(--ink);margin-bottom:10px}
.q-hint{font-size:12px;color:var(--ink-light);background:var(--paper);border-left:2px solid var(--paper-dark);padding:10px 14px;border-radius:0 8px 8px 0;margin-bottom:22px;line-height:1.65}

/* 비교표 */
.cmp-table{width:100%;border-collapse:collapse;margin-bottom:20px;font-size:12px}
.cmp-table th{background:var(--paper);padding:8px 12px;text-align:center;color:var(--ink-light);font-weight:500;letter-spacing:.5px;border:1px solid var(--paper-dark)}
.cmp-table td{padding:9px 12px;border:1px solid var(--paper-mid);color:var(--ink-mid);text-align:center;line-height:1.5}
.cmp-table tr:nth-child(even) td{background:var(--paper)}

/* 선택지 */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{background:#fff;border:1.5px solid var(--paper-dark);border-radius:12px;padding:15px 18px;font-size:14px;color:var(--ink-mid);cursor:pointer;text-align:left;display:flex;align-items:flex-start;gap:12px;line-height:1.65;transition:border-color .15s,background .15s;font-family:'Noto Sans KR',sans-serif;width:100%}
.opt:hover{border-color:var(--sage-light)}
.opt.sel{border-color:var(--sage);background:var(--sage-pale);color:var(--sage)}
.odot{width:17px;height:17px;border-radius:50%;border:2px solid var(--paper-dark);flex-shrink:0;margin-top:2px;transition:all .15s;background:#fff}
.opt.sel .odot{background:var(--sage);border-color:var(--sage)}

.bool-r{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bbtn{background:#fff;border:1.5px solid var(--paper-dark);border-radius:12px;padding:22px 14px;font-size:15px;cursor:pointer;text-align:center;color:var(--ink-mid);transition:all .18s;font-family:'Noto Sans KR',sans-serif}
.bbtn.yes{border-color:var(--sage);background:var(--sage-pale);color:var(--sage);font-weight:600}
.bbtn.no{border-color:var(--paper-dark);background:var(--paper);color:var(--ink-light)}

/* 네비 */
.q-nav{display:flex;justify-content:space-between;align-items:center;margin-top:26px;padding-top:22px;border-top:1px solid var(--paper-mid)}
.btn-back{background:none;border:1.5px solid var(--paper-dark);border-radius:9px;padding:11px 20px;font-size:13px;color:var(--ink-light);cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .2s}
.btn-back:hover{border-color:var(--ink-light);color:var(--ink)}
.btn-back:disabled{opacity:.3;cursor:not-allowed}
.btn-next{background:var(--ink);border:none;border-radius:9px;padding:13px 28px;font-size:13px;color:#fff;cursor:pointer;font-weight:500;transition:background .2s;font-family:'Noto Sans KR',sans-serif}
.btn-next:hover{background:var(--sage)}
.btn-next:disabled{background:var(--paper-dark);cursor:not-allowed}

/* 단계 표시 */
.phase-tag{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:10px;font-weight:500;letter-spacing:1px;margin-bottom:16px}
.phase-1{background:var(--sage-pale);color:var(--sage)}
.phase-2{background:var(--cobalt-pale);color:var(--cobalt)}
.phase-3{background:var(--rust-pale);color:var(--rust)}

/* ── 타이브레이크 ── */
.tie-wrap{padding:40px 40px 32px}
.tie-eye{font-size:10px;letter-spacing:2.5px;color:var(--rust);font-weight:500;margin-bottom:8px}
.tie-t{font-family:'Noto Serif KR',serif;font-size:22px;color:var(--ink);margin-bottom:8px}
.tie-s{font-size:13px;color:var(--ink-light);line-height:1.7;margin-bottom:24px}
.tie-q{font-family:'Noto Serif KR',serif;font-size:18px;color:var(--ink);line-height:1.7;margin-bottom:22px;padding:16px 20px;background:var(--paper);border-radius:12px;border-left:3px solid var(--rust)}

/* ── 결과 ── */
.res-hero{padding:0;overflow:hidden}
.res-banner{height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.res-banner::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent 60%,rgba(0,0,0,.08))}
.res-main-lbl{font-size:11px;letter-spacing:2.5px;color:rgba(255,255,255,.75);margin-bottom:6px;font-weight:500;z-index:1}
.res-type-name{font-family:'Noto Serif KR',serif;font-size:30px;font-weight:700;color:#fff;z-index:1;text-align:center;line-height:1.35;text-shadow:0 2px 12px rgba(0,0,0,.18)}
.res-hanja{font-size:13px;color:rgba(255,255,255,.7);z-index:1;margin-top:6px;letter-spacing:1px}

.res-body{padding:32px 36px}
.conf-row{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.conf-bar-w{flex:1;height:6px;background:var(--paper-mid);border-radius:3px;overflow:hidden}
.conf-bar-f{height:100%;border-radius:3px;transition:width 1s ease .3s}
.conf-lbl{font-size:11px;color:var(--ink-light);white-space:nowrap}
.conf-pct{font-size:13px;font-weight:600;width:36px;text-align:right}

.res-desc{font-size:13px;color:var(--ink-mid);line-height:1.9;padding:18px 20px;background:var(--paper);border-radius:12px;margin-bottom:24px}

.res-sec-l{font-size:10px;letter-spacing:2px;color:var(--ink-faint);padding-bottom:8px;border-bottom:1px solid var(--paper-dark);margin-bottom:14px}

.score-bars{margin-bottom:8px}
.sc-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sc-nm{font-size:11px;color:var(--ink-mid);width:110px;text-align:right;flex-shrink:0;line-height:1.3}
.sc-tr{flex:1;height:7px;background:var(--paper-mid);border-radius:4px;overflow:hidden}
.sc-fi{height:100%;border-radius:4px;transition:width 1s ease .3s}
.sc-vl{font-size:11px;font-weight:500;width:30px}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.info-box{background:#fff;border:1px solid var(--paper-dark);border-radius:14px;padding:20px 22px}
.ib-t{font-size:10px;letter-spacing:1.5px;color:var(--ink-faint);padding-bottom:8px;border-bottom:1px solid var(--paper-mid);margin-bottom:12px}
.ib-item{font-size:13px;color:var(--ink-mid);padding:6px 0;border-bottom:1px solid var(--paper-mid);line-height:1.6;display:flex;gap:8px}
.ib-item:last-child{border-bottom:none}
.ib-dot{flex-shrink:0;font-weight:700}

.food-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.food-box{border-radius:10px;padding:14px}
.food-box.good{background:var(--sage-pale);border:1px solid #B0D4B6}
.food-box.bad{background:var(--rust-pale);border:1px solid #D4A898}
.fb-t{font-size:10px;font-weight:600;letter-spacing:.5px;margin-bottom:9px}
.food-box.good .fb-t{color:var(--sage)}
.food-box.bad .fb-t{color:var(--rust)}
.ftags{display:flex;flex-wrap:wrap;gap:5px}
.ftag{font-size:11px;padding:3px 8px;border-radius:12px}
.food-box.good .ftag{background:rgba(92,124,94,.15);color:var(--sage)}
.food-box.bad .ftag{background:rgba(158,90,58,.12);color:var(--rust)}

.sp-box{background:#fff;border:1px solid var(--paper-dark);border-radius:14px;padding:20px 22px;margin-bottom:20px}
.sp-item{font-size:13px;color:var(--ink-mid);padding:7px 0;border-bottom:1px solid var(--paper-mid);line-height:1.65;display:flex;gap:8px}
.sp-item:last-child{border-bottom:none}
.sp-dot{color:var(--sage);font-weight:700;flex-shrink:0}

.btn-restart{width:100%;background:none;border:1.5px solid var(--ink-mid);border-radius:11px;padding:14px;font-size:14px;color:var(--ink-mid);cursor:pointer;transition:all .2s;font-family:'Noto Sans KR',sans-serif}
.btn-restart:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.res-disc{font-size:11px;color:var(--ink-faint);text-align:center;line-height:1.8;margin-top:10px}

@media(max-width:560px){
  .start-hero,.start-body,.q-wrap,.res-body,.tie-wrap{padding-left:22px;padding-right:22px}
  .two-col,.info-grid{grid-template-columns:1fr}
  .bool-r{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="hdr">
  <div class="hdr-inner">
    <div class="logo">나를 위한 건강지도<span>김주式 사상의학 임상 원전 기반</span></div>
  </div>
  <div class="pbar-w"><div class="pbar-f" id="pbar" style="width:0%"></div></div>
</div>

<div class="page"><div class="inner" id="area"></div></div>

<script>
/* ══════════════════════════════════════════════════════
   9대 계열 데이터
   소음인: 신수열·신계 / 신수열·위계 / 위수한계  ← 수정
══════════════════════════════════════════════════════ */
const SUBS = {

  /* ── 태음인 ── */
  '태음인위완계':{

    hanja:'胃脘受寒表寒病', color:'#5C7C5E', bg:'linear-gradient(135deg,#5C7C5E,#8EAD8E)',
    desc:'위완(명치)이 냉사를 받아 폐기가 허해지는 계열입니다. 안색이 청백하고 수족이 건조하며 차갑습니다. 완실무병의 조건은 전신에 땀이 잘 소통되는 것이며, 발병 시 땀이 전혀 나지 않게 됩니다. 커피를 마셔도 잠을 잘 자는 경향이 있고 따뜻한 물을 선호합니다.',
    healthy:['전신에 땀이 적당히 소통될 것','대변이 부드럽고 규칙적일 것','수족이 따뜻하게 유지될 것'],
    warning:['무한(땀 전혀 없음) 지속 시 위험','극심한 오한·사지 냉증 주의','가슴 두근거림(정충) = 중증 신호'],
    good:['쇠고기','율무','콩','고구마','연근','도라지','호두','잣','밤','마','더덕'],
    bad:['닭고기','돼지고기','인삼','홍삼','생강','고추'],
    special:['규칙적 유산소 운동으로 발한 유도','몸을 차게 하는 환경 금지','커피 소량 허용 — 숙면에 도움']
  },
  '태음인간계':{
    main:'태음인', label:'태음인 간계', fullLabel:'태음인 간계 — 肝受熱裏熱病',
    hanja:'肝受熱裏熱病', color:'#6A8040', bg:'linear-gradient(135deg,#6A8040,#9AAA60)',
    desc:'간열(肝熱)이 상승하여 폐를 조(燥)하게 하는 계열입니다. 안색이 황·적·흑색을 띠거나 뺨에 홍조·피지가 많습니다. 커피 2잔 이상이면 불면이 오고, 변비 시 입이 쓰고(구고) 뒷목이 뻣뻣해집니다(항강). 찬물을 즐겨 찾는 것이 특징입니다.',
    healthy:['대변이 규칙적이고 단단하지 않을 것','구고·항강이 없을 것','뺨 열감이 과하지 않을 것'],
    warning:['변비+구고+항강 지속 = 중증','안면홍조+두통+불면 동시 발생 주의','정충(가슴 두근거림) = 위험 신호'],
    good:['쇠고기','콩','두부','율무','연근','도라지','녹두','오이','칡','갈근'],
    bad:['닭고기','돼지고기','인삼','홍삼','꿀','생강','고추'],
    special:['분노·스트레스 감정 조절 최우선','충분한 수면 확보','변비 발생 즉시 식이 조절']
  },

  /* ── 소양인 ── */
  '소양인비계':{
    main:'소양인', label:'소양인 비계', fullLabel:'소양인 비계 — 脾受寒表寒病',
    hanja:'脾受寒表寒病', color:'#9E5A3A', bg:'linear-gradient(135deg,#9E5A3A,#C4845C)',
    desc:'비장이 한사를 받아 신음이 부족해지는 계열입니다. 수족이 냉하고 한출이 없으며, 냄새 없는 방귀가 잦습니다. 찬물을 마시면 설사를 하기 쉽고 물을 잘 마시지 않습니다. 발뒤꿈치 종렬(踵裂)이 잘 발생하고 냉두통이 특징입니다.',
    healthy:['대변이 막힘없이 소통될 것','수족이 따뜻하게 유지될 것','방귀가 잦지 않을 것'],
    warning:['수족 냉증 심화 = 비냉 악화 신호','냉두통 발생 시 즉시 보온','발뒤꿈치 종렬 심화 주의'],
    good:['돼지고기','보리','팥','수박','오이','상추','굴','해산물','파인애플','참외'],
    bad:['닭고기','인삼','홍삼','꿀','생강','고추','찹쌀'],
    special:['찬 음식·음료 주의','발뒤꿈치 보습 및 보온 관리','냉두통 발생 시 즉시 보온']
  },
  '소양인위계':{
    main:'소양인', label:'소양인 위계', fullLabel:'소양인 위계 — 胃受熱裏熱病',
    hanja:'胃受熱裏熱病', color:'#A0602A', bg:'linear-gradient(135deg,#A0602A,#C89050)',

  {pair:['소양인위계','태음인간계'],
   q:'변비 시 어떤 증상이 동반되나요?',
   a:['입이 마르고 구취가 심해지며 가슴 답답 (구조)','입이 씁쓸하고 뒷목이 뻣뻣 (구고·항강)'],
   w:['소양인위계','태음인간계']},
  {pair:['태양인외감','태양인내촉'],
   q:'음식을 삼키기 어려운 증상이 자주 있나요?',
   a:['아니다','자주 구역질·삼킴 곤란이 있다'],
   w:['태양인외감','태양인내촉']},
];

/* ══════════════════════════════════════════════════════
   상태 관리
══════════════════════════════════════════════════════ */
let st = {
  page:'start', gender:null,
  phase:1, qi:0,
  ans:{},
  mainSc:{},   // 주체질 점수
  subSc:{},    // 계열 점수
  confirmedMain:null,
  result:null, tb:null, confirmedGrade:null
};

function initSc() {
  st.mainSc = {}; MAINS.forEach(m => st.mainSc[m] = 0);
  st.subSc  = {}; ALL_SUBS.forEach(k => st.subSc[k] = 0);
}
initSc();

function visibleQs() {
  const ph1 = QS_PHASE1;
  let ph2 = QS_PHASE2.concat(QS_FEMALE.filter(q => st.gender === 'female'));
  // 2단계는 확정된 주체질 + ALL 타겟만
  if (st.confirmedMain) {
    ph2 = ph2.filter(q => q.targetMain === st.confirmedMain || q.targetMain === 'ALL');
  }
  return st.phase === 1 ? ph1 : ph2;
}

function totalProgress() {
  const ph1 = QS_PHASE1.length;
  const ph2est = QS_PHASE2.filter(q => q.targetMain === (st.confirmedMain||'태음인') || q.targetMain === 'ALL').length
    + (st.gender === 'female' ? QS_FEMALE.length : 0);
  const done = (st.phase === 1 ? st.qi : ph1 + st.qi);
  return Math.round((done / (ph1 + ph2est)) * 100);
}

/* ══════════════════════════════════════════════════════
   렌더링
══════════════════════════════════════════════════════ */
function render() {
  const area = document.getElementById('area');
  const pbar = document.getElementById('pbar');
  pbar.style.width = (st.page === 'start' ? 0 : st.page === 'result' ? 100 : totalProgress()) + '%';
  if (st.page === 'start')  { renderStart(area); return; }
  if (st.page === 'q')      { renderQ(area); return; }
  if (st.page === 'tie')    { renderTie(area); return; }
  if (st.page === 'result') { renderResult(area); return; }
}

function renderStart(a) {
  // 성별 확정 전에는 남성 기준으로 예상 문항 수 계산
  const ph1 = QS_PHASE1.length;
  const ph2 = QS_PHASE2.length + (st.gender === 'female' ? QS_FEMALE.length : 0);
  const totalQ = ph1 + ph2;
  const qLabel = st.gender ? `${totalQ}문항` : `${ph1 + QS_PHASE2.length}~${ph1 + QS_PHASE2.length + QS_FEMALE.length}문항`;

  a.innerHTML = `<div class="card">
  <div class="start-hero">
    <div class="start-eye">나를 위한 건강지도</div>
    <div class="start-t">체질 자가 진단</div>
    <div class="start-d">김주式 사상의학 임상 원전 기반</div>
  </div>
  <div class="start-body">
    <div class="info-grid">
      <div class="info-cell"><div class="ic-l">소요 시간</div><div class="ic-v">약 8~12분</div></div>
      <div class="info-cell"><div class="ic-l">문항 수</div><div class="ic-v">${qLabel}</div></div>
    </div>
    <p style="font-size:12px;color:var(--ink-light);margin-bottom:14px;text-align:center">성별을 선택해 주세요 — 여성은 부인과 관련 문항이 추가됩니다</p>
    <div class="gender-row">
      <button class="gbtn${st.gender==='male'?' sel':''}" onclick="setGender('male')">
        <div class="gbtn-ico">👤</div>남성
      </button>
      <button class="gbtn${st.gender==='female'?' sel':''}" onclick="setGender('female')">
        <div class="gbtn-ico">👤</div>여성
      </button>
    </div>
    <button class="btn-start" onclick="startQ()" ${st.gender?'':'disabled'}>진단 시작하기</button>
    <p class="disc">본 진단은 참고용이며 정확한 체질 판정은 반드시 한의사의 진료가 필요합니다</p>
  </div></div>`;
}

function setGender(g) { st.gender = g; render(); }
function startQ() { st.page='q'; st.phase=1; st.qi=0; render(); }

const PH_LABEL = {1:'1단계 · 주체질 확정', 2:'2단계 · 계열 확정'};
const PH_CLS   = {1:'phase-1',2:'phase-2'};
const PH_DESC  = {
  1:'외형·대변·수족 지표로 주체질을 결정합니다',
  2:'생리 지표로 세부 계열을 확정합니다'
};

function renderQ(a) {
  const vqs = visibleQs();
  const q = vqs[st.qi];
  const ans = st.ans[q.id];

  let tableHtml = '';
  if (q.viz === 'stool_width') {
    tableHtml = buildStoolWidthViz();
  } else if (q.viz === 'stool_shape') {
    tableHtml = buildStoolShapeViz();
  } else if (q.viz === 'costal_angle') {
    tableHtml = buildCostalViz();
  } else if (q.tableRows) {
    tableHtml = `<table class="cmp-table">
      <tr><th>체질</th><th>굵기</th><th>특징</th></tr>
      ${q.tableRows.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}
    </table>`;
  }

  let body = '';
  if (q.type === 'bool') {
    body = `<div class="bool-r">
    <button class="bbtn${ans==='yes'?' yes':''}" onclick="aBool('yes')">예, 그렇습니다</button>
    <button class="bbtn${ans==='no'?' no':''}" onclick="aBool('no')">아니오</button>
    </div>`;
  } else {
    body = `<div class="opts">` + q.opts.map((o,i) =>
      `<button class="opt${ans===i?' sel':''}" onclick="aCh(${i})">
        <div class="odot"></div><span>${o.t}</span>
      </button>`).join('') + `</div>`;
  }

  a.innerHTML = `<div class="card"><div class="q-wrap">
    <div class="q-text">${q.text}</div>
    ${q.hint ? `<div class="q-hint">${q.hint}</div>` : ''}
    ${tableHtml}${body}
    <div class="q-nav">
      <button class="btn-back" onclick="goBack()" ${(st.phase===1&&st.qi===0)?'disabled':''}>← 이전</button>
      <button class="btn-next" onclick="goNext()" ${ans!==undefined?'':'disabled'}>
        ${st.qi===vqs.length-1 ? (st.phase===1?'다음 단계 →':'결과 보기') : '다음 →'}
      </button>
    </div>
  </div></div>`;
}

function aBool(v) {
  const vqs = visibleQs();
  const q = vqs[st.qi]; st.ans[q.id] = v;
  renderQ(document.getElementById('area'));
  setTimeout(() => goNext(), 280);
}

function aCh(i) {
  const vqs = visibleQs();
  st.ans[vqs[st.qi].id] = i;
  renderQ(document.getElementById('area'));
}

function goBack() {
  if (st.qi > 0) { st.qi--; render(); return; }
  if (st.phase === 2) {
    // 2단계 첫 문항 → 1단계 마지막 문항으로
    st.phase = 1; st.qi = QS_PHASE1.length - 1; st.confirmedMain = null; render();
  }
}

function goNext() {
  const vqs = visibleQs();
  const q = vqs[st.qi];
  if (st.ans[q.id] === undefined) return;
  if (st.qi < vqs.length - 1) { st.qi++; render(); }
  else {
    if (st.phase === 1) calcPhase1();
    else calcFinal();
  }
}

/* ── 1단계 계산: 주체질 확정 ── */
function calcPhase1() {
  initSc();
  QS_PHASE1.forEach(q => {
    const a = st.ans[q.id];
    if (a === undefined) return;
    let sc;
    if (q.type === 'bool') {
      sc = (a === 'yes' ? q.yes : q.no);
      if (sc.main) applyMainSc(sc.main, q.weight);
      if (sc.sub)  applySubSc(sc.sub, q.weight);
    } else {
      const opt = q.opts[a];
      if (!opt) return;
      if (opt.main) applyMainSc(opt.main, q.weight);
      if (opt.sub)  applySubSc(opt.sub, q.weight);
    }
  });

  // 주체질 확정
  const sorted = MAINS.map(m => ({m, v:st.mainSc[m]})).sort((a,b)=>b.v-a.v);
  const diff = sorted[0].v - sorted[1].v;

  // 주체질이 명확하면 2단계로, 애매하면 그대로 2단계 (확정 없이)
  if (diff >= 4) {
    st.confirmedMain = sorted[0].m;
  } else {
    // 상위 두 체질 모두 2단계에 포함
    st.confirmedMain = null;
  }

  st.phase = 2; st.qi = 0; render();
}

/* ── 2단계 계산: 계열 확정 ── */
function calcFinal() {
  // 2단계 답변 반영
  const vqs = visibleQs();
  vqs.forEach(q => {
    const a = st.ans[q.id];
    if (a === undefined) return;
    let sc;
    if (q.type === 'bool') {
      sc = (a === 'yes' ? q.yes : q.no);
      if (sc && sc.sub) applySubSc(sc.sub, q.weight);
    } else {
      const opt = q.opts[a];
      if (!opt) return;
      if (opt.sub) applySubSc(opt.sub, q.weight);
    }
  });

  // 주체질 점수 기반 계열 점수 보정
  // 1단계에서 확정된 주체질의 계열들에 보너스
  MAINS.forEach(m => {
    const bonus = st.mainSc[m] * 0.5;
    MAIN_MAP[m].forEach(sub => { st.subSc[sub] += bonus; });
  });

  // 확정된 주체질이 있으면 다른 주체질 계열 대폭 감점
  if (st.confirmedMain) {
    ALL_SUBS.forEach(k => {
      if (!k.startsWith(st.confirmedMain.slice(0,2))) {
        // 단, 태음→태양 등 겹치는 글자 방지: 주체질 소속이 아닌 경우
        const belongs = MAIN_MAP[st.confirmedMain].includes(k);
        if (!belongs) st.subSc[k] -= 20;
      }
    });
    // 소음인은 세 계열 모두 포함
  }

  ALL_SUBS.forEach(k => { st.subSc[k] = Math.max(0, st.subSc[k]); });

  const sorted = ALL_SUBS.map(k => ({k, v:st.subSc[k]})).sort((a,b) => b.v - a.v);
  const top1 = sorted[0], top2 = sorted[1];
  const diff = top1.v - top2.v;

  // 확신도 등급
  if (diff >= 8) st.confirmedGrade = 'A';
  else if (diff >= 4) st.confirmedGrade = 'B';
  else if (diff >= 2) st.confirmedGrade = 'C';
  else st.confirmedGrade = 'D';

  if (diff > 3) {
    st.result = top1.k; st.page = 'result'; render(); return;
  }

  // 동점 처리
  const tb = TBS.find(t =>
    (t.pair[0]===top1.k && t.pair[1]===top2.k) ||
    (t.pair[0]===top2.k && t.pair[1]===top1.k)
  );
  if (tb) {
    st.tb = {...tb, top1:top1.k, top2:top2.k};
    st.page = 'tie'; render(); return;
  }
  st.result = top1.k; st.page = 'result'; render();
}

function applyMainSc(scMap, weight) {
  Object.entries(scMap).forEach(([k, v]) => {
    if (st.mainSc[k] !== undefined) st.mainSc[k] += v * (weight/3);
  });
}
function applySubSc(scMap, weight) {
  Object.entries(scMap).forEach(([k, v]) => {
    if (st.subSc[k] !== undefined) st.subSc[k] += v * (weight/3);
  });
}

/* ── 타이브레이크 ── */
function renderTie(a) {
  const tb = st.tb;
  const l1 = SUBS[tb.top1]?.label||tb.top1;
  const l2 = SUBS[tb.top2]?.label||tb.top2;
  a.innerHTML = `<div class="card"><div class="tie-wrap">
    <div class="tie-eye">최종 판정 질문</div>
    <div class="tie-t">두 계열이 근소한 차이입니다</div>
    <div class="tie-s"><b>${l1}</b> / <b>${l2}</b><br>아래 질문으로 최종 계열을 확정합니다.</div>
    <div class="tie-q">${tb.q}</div>
    <div class="opts">
      <button class="opt" onclick="resolveTie(0)"><div class="odot"></div><span>${tb.a[0]}</span></button>
      <button class="opt" onclick="resolveTie(1)"><div class="odot"></div><span>${tb.a[1]}</span></button>
    </div>
  </div></div>`;
}

function resolveTie(i) {
  st.result = st.tb.w[i]; st.confirmedGrade = 'B';
  st.page = 'result'; render();
}

/* ── 결과 ── */
function renderResult(a) {
  const rk = st.result;
  const d = SUBS[rk];
  const col = d.color;

  // 데이터 전송
  const SHEET_URL = 'https://script.google.com/macros/s/AKfycbzX6NouJw3s5evArwuxF1CDRWWnYNdGRng7iX0RlScckiy9F_7FfSC1B_74UII9HOdjhQ/exec';
  fetch(SHEET_URL,{method:'POST',body:JSON.stringify({
    gender:st.gender, result:st.result, grade:st.confirmedGrade,
    mainSc:st.mainSc, subSc:st.subSc, answers:st.ans
  })}).catch(()=>{});

  const confPct = {A:92,B:72,C:45,D:20}[st.confirmedGrade]||50;
  const confMsg = {A:'매우 높음',B:'높음',C:'보통',D:'혼합형'}[st.confirmedGrade];

  const sorted = ALL_SUBS.map(k=>({k,v:st.subSc[k]})).sort((a,b)=>b.v-a.v);
  const top6 = sorted.slice(0,6);
  const mx = top6[0].v || 1;
  const bars = top6.map(it => {
    const pct = Math.round((it.v/mx)*100);
    const isTop = it.k === rk;
    const c = isTop ? col : '#C8B89A';
    return `<div class="sc-row">
      <div class="sc-nm" style="${isTop?'font-weight:600;color:'+col:''}">${SUBS[it.k]?.label||it.k}</div>
      <div class="sc-tr"><div class="sc-fi" style="width:${pct}%;background:${c}"></div></div>
      <div class="sc-vl" style="color:${isTop?col:'var(--ink-faint)'}">${it.v.toFixed(1)}</div>
    </div>`;
  }).join('');

  const healthItems = d.healthy.map(s=>`<div class="ib-item"><span class="ib-dot" style="color:${col}">✓</span><span>${s}</span></div>`).join('');
  const warnItems  = d.warning.map(s=>`<div class="ib-item"><span class="ib-dot" style="color:#9E5A3A">⚠</span><span>${s}</span></div>`).join('');
  const specItems  = d.special.map(s=>`<div class="sp-item"><span class="sp-dot">·</span><span>${s}</span></div>`).join('');

  // 주체질 점수 바
  const mainSorted = MAINS.map(m=>({m,v:st.mainSc[m]})).sort((a,b)=>b.v-a.v);
  const mxMain = mainSorted[0].v || 1;
  const mainBars = mainSorted.map(it => {
    const pct = Math.round((it.v/mxMain)*100);
    const isTop = d.main === it.m;
    const mc = {'태음인':col,'소양인':'#9E5A3A','소음인':'#3A5A8A','태양인':'#6A7040'}[it.m]||col;
    return `<div class="sc-row">
      <div class="sc-nm" style="${isTop?'font-weight:600;color:'+mc:''}">${it.m}</div>
      <div class="sc-tr"><div class="sc-fi" style="width:${pct}%;background:${isTop?mc:'#C8B89A'}"></div></div>
      <div class="sc-vl" style="color:${isTop?mc:'var(--ink-faint)'}">${it.v.toFixed(1)}</div>
    </div>`;
  }).join('');

  a.innerHTML = `<div class="card res-hero">
    <div class="res-banner" style="background:${d.bg}">
      <div class="res-main-lbl">${d.main} · ${d.hanja}</div>
      <div class="res-type-name">${d.label}</div>
      <div class="res-hanja">${d.fullLabel}</div>
    </div>
  </div>

  <div class="card" style="margin-top:12px">
  <div class="res-body">
    <div class="res-sec-l">진단 확신도</div>
    <div class="conf-row">
      <div class="conf-lbl">${st.confirmedGrade}등급</div>
      <div class="conf-bar-w"><div class="conf-bar-f" style="width:${confPct}%;background:${col}"></div></div>
      <div class="conf-pct" style="color:${col}">${confPct}%</div>
      <div class="conf-lbl">${confMsg}</div>
    </div>
    <div class="res-desc">${d.desc}</div>

    <div class="res-sec-l" style="margin-top:20px">주체질 점수 분포</div>
    <div class="score-bars" style="margin-bottom:20px">${mainBars}</div>

    <div class="res-sec-l">계열별 점수 분포 (상위 6)</div>
    <div class="score-bars" style="margin-bottom:20px">${bars}</div>

    <div class="two-col">
      <div class="info-box">
        <div class="ib-t">완실무병의 조건</div>${healthItems}
        <div style="height:8px"></div>
        <div style="font-size:10px;letter-spacing:1px;color:var(--ink-faint);margin:8px 0 6px">위기 징후</div>
        ${warnItems}
      </div>
      <div class="info-box">
        <div class="ib-t">음식 득(得)과 실(失)</div>
        <div class="food-grid">
          <div class="food-box good"><div class="fb-t">✓ 이로운 음식</div><div class="ftags">${d.good.map(f=>`<span class="ftag">${f}</span>`).join('')}</div></div>
          <div class="food-box bad"><div class="fb-t">✗ 금기 음식</div><div class="ftags">${d.bad.map(f=>`<span class="ftag">${f}</span>`).join('')}</div></div>
        </div>
      </div>
    </div>

    <div class="sp-box">
      <div class="res-sec-l">생활 관리 포인트</div>${specItems}
    </div>

    <button class="btn-restart" onclick="restart()">↩ 처음으로 돌아가기</button>
    <p class="res-disc">⚕ 본 진단은 참고용입니다. 정확한 체질 판정은 반드시 한의사의 진료를 받으시기 바랍니다.</p>
  </div></div>`;

  // 애니메이션
  setTimeout(() => {
    document.querySelectorAll('.conf-bar-f, .sc-fi').forEach(el => {
      const w = el.style.width; el.style.width='0%';
      setTimeout(() => el.style.width = w, 50);
    });
  }, 100);
}

function restart() {
  st = {page:'start',gender:null,phase:1,qi:0,ans:{},mainSc:{},subSc:{},
        confirmedMain:null,result:null,tb:null,confirmedGrade:null};
  initSc(); render();
}

/* ══════════════════════════════════════════════════════
   SVG 시각화 함수
══════════════════════════════════════════════════════ */

/* 굵기 비교 — 실제 동전 크기 비율로 표현 */
function buildStoolWidthViz() {
  /* 실제 동전 직경: 500원=26.5mm, 100원=24mm, 50원=21.6mm
     대변 단면을 동전으로 직관적 비교.
     SVG 내 비율: 500원 r=33, 100원 r=30, 50원 r=27 */

  // 동전 색상 (금속 느낌, 황토와 구분)
  const C500 = '#B8A060'; // 500원 골드
  const C100 = '#C0C0C0'; // 100원 실버
  const C50  = '#C8A860'; // 50원 브론즈
  const SH   = 'rgba(0,0,0,0.08)'; // 그림자

  return `<div style="background:var(--paper);border-radius:12px;padding:18px 16px 16px;margin-bottom:18px;border:1px solid var(--paper-dark)">

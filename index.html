<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나를 위한 건강지도 : 자가 진단법</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --sage:#7A9E7E;--sage-light:#A8C5A0;--sage-dark:#4E7053;
  --beige:#F5F0E8;--beige-mid:#E8DFD0;--beige-dark:#C8B89A;
  --cream:#FDFAF4;--text-dark:#3A3028;--text-mid:#6B5C50;--text-light:#9B8B7E;
  --orange-soft:#E8A87C;
}
html,body{width:100%;min-height:100vh;background:var(--beige);font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;color:var(--text-dark)}
#app{min-height:100vh;background:linear-gradient(155deg,#EDF2EC 0%,#F5F0E8 55%,#EDE4D6 100%)}
.hdr{background:rgba(253,250,244,0.97);border-bottom:1px solid var(--beige-dark);padding:14px 24px;text-align:center;position:sticky;top:0;z-index:50;backdrop-filter:blur(8px)}
.hdr-t{font-family:'Noto Serif KR',Georgia,serif;font-size:17px;font-weight:600;color:var(--sage-dark);letter-spacing:1px}
.hdr-s{font-size:10px;color:var(--text-light);margin-top:3px;letter-spacing:1px}
.pbar-w{width:100%;height:3px;background:var(--beige-dark)}
.pbar-f{height:100%;background:var(--sage-dark);transition:width .5s ease}
.wrap{display:flex;justify-content:center;padding:28px 20px;min-height:calc(100vh - 80px)}
.inner{width:100%;max-width:740px}

/* GENDER SELECT */
.gender-card{background:var(--cream);border:1px solid var(--beige-dark);border-radius:20px;padding:48px 40px;text-align:center}
.gender-title{font-family:'Noto Serif KR',serif;font-size:22px;color:var(--sage-dark);margin-bottom:8px}
.gender-sub{font-size:13px;color:var(--text-light);margin-bottom:36px;line-height:1.7}
.gender-btns{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:360px;margin:0 auto}
.g-btn{background:#fff;border:1.5px solid var(--beige-dark);border-radius:16px;padding:28px 20px;font-size:18px;cursor:pointer;text-align:center;color:var(--text-dark);transition:all .2s;font-family:'Noto Sans KR',sans-serif}
.g-btn:hover{border-color:var(--sage-dark);background:rgba(78,112,83,.06)}
.g-icon{font-size:32px;margin-bottom:8px}

/* START */
.start-card{background:var(--cream);border:1px solid var(--beige-dark);border-radius:20px;padding:52px 44px;text-align:center;animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.si{font-size:48px;margin-bottom:18px}
.st{font-family:'Noto Serif KR',serif;font-size:13px;color:var(--text-light);letter-spacing:2px;margin-bottom:6px}
.st2{font-family:'Noto Serif KR',serif;font-size:30px;font-weight:600;color:var(--sage-dark);margin-bottom:24px;letter-spacing:1px;line-height:1.4}
.sd{font-size:13px;color:var(--text-mid);line-height:1.9;margin-bottom:32px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:32px}
.sc{background:var(--beige);border-radius:10px;padding:14px;text-align:center}
.sl{font-size:10px;color:var(--text-light);margin-bottom:5px}
.sv{font-size:14px;font-weight:500;color:var(--text-dark)}
.btn-s{width:100%;background:var(--sage-dark);border:none;border-radius:12px;padding:17px;font-size:16px;color:#fff;cursor:pointer;font-family:'Noto Serif KR',serif;font-weight:600;letter-spacing:1px;transition:background .2s}
.btn-s:hover{background:var(--sage)}
.disc-s{font-size:10px;color:var(--text-light);margin-top:14px;line-height:1.7}

/* SECTION HEADER */
.sec-hdr{background:var(--beige);border-radius:10px;padding:10px 16px;margin-bottom:16px;font-size:11px;color:var(--text-mid);letter-spacing:1px;border-left:3px solid var(--sage)}
.sec-hdr b{color:var(--sage-dark)}

/* QUESTION CARD */
.q-card{background:var(--cream);border:1px solid var(--beige-dark);border-radius:20px;padding:38px 36px;animation:fadeUp .3s ease}
.q-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 13px;border-radius:20px;font-size:10px;letter-spacing:1.5px;margin-bottom:16px;font-weight:500;color:#fff}
.q-num{font-size:11px;color:var(--text-light);margin-bottom:8px}
.q-text{font-family:'Noto Serif KR',serif;font-size:21px;font-weight:400;color:var(--text-dark);line-height:1.75;margin-bottom:8px}
.q-hint{font-size:12px;color:var(--text-light);padding:10px 14px;background:var(--beige);border-radius:8px;border-left:2px solid var(--beige-dark);margin-bottom:22px;line-height:1.65}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:#fff;border:1.5px solid var(--beige-dark);border-radius:12px;padding:16px 20px;font-size:15px;color:var(--text-dark);cursor:pointer;text-align:left;display:flex;align-items:flex-start;gap:12px;line-height:1.6;transition:border-color .15s,background .15s;font-family:'Noto Sans KR',sans-serif}
.opt:hover{border-color:var(--sage)}
.opt.sel{border-color:var(--sage-dark);background:rgba(78,112,83,.07);color:var(--sage-dark)}
.odot{width:18px;height:18px;border-radius:50%;border:2px solid var(--beige-dark);flex-shrink:0;margin-top:2px;transition:all .15s;background:#fff}
.opt.sel .odot{background:var(--sage-dark);border-color:var(--sage-dark)}
.bool-r{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bbtn{background:#fff;border:1.5px solid var(--beige-dark);border-radius:14px;padding:24px 16px;font-size:17px;cursor:pointer;text-align:center;color:var(--text-dark);transition:all .18s;line-height:1.5;font-family:'Noto Sans KR',sans-serif}
.bbtn:hover{border-color:var(--sage)}
.bbtn.yes{border-color:var(--sage-dark);background:rgba(78,112,83,.07);color:var(--sage-dark);font-weight:600}
.bbtn.no{border-color:var(--beige-dark);background:var(--beige);color:var(--text-mid)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:28px}
.btn-b{background:none;border:1.5px solid var(--beige-dark);border-radius:9px;padding:11px 22px;font-size:13px;color:var(--text-light);cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.btn-b:hover{border-color:var(--text-light);color:var(--text-dark)}
.btn-b:disabled{opacity:.3;cursor:not-allowed}
.btn-n{background:var(--sage-dark);border:none;border-radius:9px;padding:13px 30px;font-size:14px;color:#fff;cursor:pointer;font-weight:500;transition:background .2s;font-family:'Noto Sans KR',sans-serif}
.btn-n:hover{background:var(--sage)}
.btn-n:disabled{background:var(--beige-dark);cursor:not-allowed}

/* VISUAL BOX */
.vis-box{background:var(--beige);border:1.5px dashed var(--beige-dark);border-radius:12px;padding:16px;margin-bottom:20px}
.vis-label{font-size:10px;color:var(--text-light);letter-spacing:1px;margin-bottom:10px}
.stool-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.stool-lbl{font-size:11px;color:var(--text-mid);width:56px;text-align:right;flex-shrink:0}
.stool-bar{border-radius:20px}
.stool-desc{font-size:11px;color:var(--text-light)}
.img-placeholder{background:linear-gradient(135deg,rgba(122,158,126,.12) 0%,rgba(200,184,154,.15) 100%);border:1.5px dashed var(--sage);border-radius:12px;padding:28px 16px;text-align:center;margin-bottom:20px}
.img-ph-icon{font-size:28px;margin-bottom:6px;opacity:.5}
.img-ph-text{font-size:11px;color:var(--text-light);letter-spacing:.5px}

/* TIE */
.tie-card{background:var(--cream);border:2px solid var(--sage);border-radius:20px;padding:38px 36px;animation:fadeUp .3s ease}
.tie-eye{font-size:10px;letter-spacing:2px;color:var(--sage-dark);font-weight:500;margin-bottom:8px}
.tie-t{font-family:'Noto Serif KR',serif;font-size:20px;color:var(--text-dark);margin-bottom:6px}
.tie-s{font-size:12px;color:var(--text-light);margin-bottom:22px;line-height:1.6}
.tie-q{font-family:'Noto Serif KR',serif;font-size:18px;color:var(--text-dark);margin-bottom:22px;line-height:1.65}

/* RESULT */
.res-wrap{animation:fadeUp .4s ease}
.res-gauge-section{background:var(--cream);border:1px solid var(--beige-dark);border-radius:20px;padding:36px 36px 28px;margin-bottom:14px;text-align:center}
.gauge-grade{font-size:13px;letter-spacing:2px;margin-bottom:6px;font-weight:500}
.gauge-msg{font-size:18px;font-family:'Noto Serif KR',serif;color:var(--text-dark);margin-bottom:4px}
.gauge-sub{font-size:12px;color:var(--text-light);margin-top:6px}

.res-emblem-section{background:var(--cream);border:1px solid var(--beige-dark);border-radius:20px;padding:32px 36px;margin-bottom:14px;text-align:center}
.emblem-wrap{display:flex;justify-content:center;margin-bottom:20px}
.res-main-type{font-size:12px;letter-spacing:1px;margin-bottom:4px;font-weight:500}
.res-sub-type{font-family:'Noto Serif KR',serif;font-size:28px;font-weight:600;color:var(--text-dark);line-height:1.35;margin-bottom:5px}
.res-hanja{font-size:13px;color:var(--text-light);margin-bottom:14px}
.res-desc{font-size:13px;color:var(--text-mid);line-height:1.9;padding:16px;background:var(--beige);border-radius:10px}

.score-section{background:var(--cream);border:1px solid var(--beige-dark);border-radius:16px;padding:24px 32px;margin-bottom:14px}
.sec-l{font-size:10px;letter-spacing:2px;color:var(--text-light);padding-bottom:7px;border-bottom:1px solid var(--beige-dark);margin-bottom:14px}
.sc-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sc-nm{font-size:11px;color:var(--text-mid);width:90px;text-align:right;flex-shrink:0}
.sc-tr{flex:1;height:8px;background:var(--beige-mid);border-radius:4px;overflow:hidden}
.sc-fi{height:100%;border-radius:4px;transition:width 1s ease .3s}
.sc-vl{font-size:11px;font-weight:500;width:28px}

.cards-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.info-card{background:var(--cream);border:1px solid var(--beige-dark);border-radius:16px;padding:22px 24px}
.card-title{font-size:10px;letter-spacing:2px;color:var(--text-light);padding-bottom:7px;border-bottom:1px solid var(--beige-dark);margin-bottom:14px}
.h-item{display:flex;gap:8px;font-size:13px;color:var(--text-mid);padding:7px 0;border-bottom:1px solid var(--beige-mid);line-height:1.6}
.h-item:last-child{border-bottom:none}
.h-dot{color:var(--sage-dark);font-weight:700;flex-shrink:0}
.w-item{display:flex;gap:8px;font-size:13px;color:#7A3A2A;padding:7px 0;border-bottom:1px solid #F0DDD8;line-height:1.6}
.w-item:last-child{border-bottom:none}
.w-dot{color:#C0603A;font-weight:700;flex-shrink:0}
.food-section{background:var(--cream);border:1px solid var(--beige-dark);border-radius:16px;padding:22px 28px;margin-bottom:14px}
.food-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.food-card{border-radius:12px;padding:16px}
.food-card.good {background:#EDF4EF;border:1px solid #B0D4B6}
.food-card.bad {background:#FBF2EF;border:1px solid #E0B8AD}
.fc-t{font-size:10px;font-weight:600;letter-spacing:.5px;margin-bottom:10px}
.food-card.good .fc-t{color:#4E7053}
.food-card.bad .fc-t{color:#8B4A3A}
.ftags{display:flex;flex-wrap:wrap;gap:5px}
.ftag{font-size:12px;padding:3px 9px;border-radius:20px}
.food-card.good .ftag{background:rgba(78,112,83,.13);color:#3A6040}
.food-card.bad .ftag{background:rgba(139,74,58,.10);color:#7A3A2A}
.sp-section{background:var(--cream);border:1px solid var(--beige-dark);border-radius:16px;padding:22px 28px;margin-bottom:14px}
.sp-item{font-size:13px;color:var(--text-mid);padding:8px 0;border-bottom:1px solid var(--beige-mid);line-height:1.65;display:flex;gap:8px}
.sp-item:last-child{border-bottom:none}
.sp-dot{color:var(--sage-dark);font-weight:700;flex-shrink:0}
.disc{font-size:11px;color:var(--text-light);text-align:center;padding:20px 16px;border-top:1px solid var(--beige-dark);line-height:1.8;margin-top:4px;background:var(--cream);border-radius:0 0 16px 16px}
.btn-r{width:100%;background:none;border:1.5px solid var(--sage-dark);border-radius:11px;padding:14px;font-size:14px;color:var(--sage-dark);cursor:pointer;font-weight:500;margin-top:14px;transition:all .2s;font-family:'Noto Sans KR',sans-serif}
.btn-r:hover{background:var(--sage-dark);color:#fff}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div class="hdr-t">나를 위한 건강지도 : 자가 진단법</div>
    <div class="hdr-s">김주식 사상의학 임상 원전 기반 · 9대 계열 분류</div>
  </div>
  <div class="pbar-w"><div class="pbar-f" id="pbar" style="width:0%"></div></div>
  <div class="wrap"><div class="inner" id="area"></div></div>
</div>

<script>
/* ═══════════════════════════════════════════
   데이터: 9대 계열 체질 정보
═══════════════════════════════════════════ */
const SUBS = {
  '태음인위완계': {
    main:'태음인', label:'태음인 1형', fullLabel:'태음인 1형 - 위완수한표한병 체질',
    hanja:'胃脘受寒表寒病', animal:'bear-snow',
    desc:'위완(명치)이 냉사를 받아 폐기가 허해지는 계열입니다. 안색이 청백하고 수족이 차며, 땀이 전신에 잘 소통되어야 건강합니다. 커피를 마셔도 잠을 잘 자고, 따뜻한 물(희온수)을 선호합니다. 대변은 세 체질 중 가장 가늘며 연변·활변 경향입니다.',
    healthy:['전신에 땀이 적당히 소통될 것','대변이 부드럽게(활변) 잘 나올 것','수족이 따뜻하게 유지될 것'],
    warning:['무한(땀이 전혀 안 남) 지속 시 위험','극심한 오한·사지 냉증 주의','가슴 두근거림(정충) = 중증 신호'],
    good:['쇠고기','율무','콩','고구마','연근','무','도라지','호두','잣','밤','더덕','녹용','마'],
    bad:['닭고기','돼지고기','찹쌀','인삼','생강','고추'],
    special:['규칙적 유산소 운동으로 발한 유도','몸을 차게 하는 환경 금지','커피 소량 허용']
  },
  '태음인간계': {
    main:'태음인', label:'태음인 2형', fullLabel:'태음인 2형 - 간수열이열병 체질',
    hanja:'肝受熱裏熱病', animal:'bear-fire',
    desc:'간열이 상승하여 폐를 조(燥)하게 하는 계열입니다. 안색이 황·적·흑색을 띠고 뺨에 홍조나 피지가 많습니다. 커피 2잔 이상이면 불면이 오고 찬물을 즐겨 찾습니다. 대변이 단단한 조변·변비 경향이며 변비 시 구고·항강이 동반됩니다.',
    healthy:['대변이 규칙적이고 단단하지 않을 것','구고(입 쓴맛)·항강이 없을 것','뺨의 열감이 과하지 않을 것'],
    warning:['심한 변비+구고+항강 지속 = 중증','안면홍조+두통+불면 동시 발생 주의','정충(가슴 두근거림) = 위험 신호'],
    good:['쇠고기','콩','두부','율무','연근','도라지','밀','녹두','오이','칡'],
    bad:['닭고기','돼지고기','인삼','홍삼','꿀','생강','고추'],
    special:['분노·스트레스 감정 조절 최우선','충분한 수면','변비 즉각 식이 조절']
  },
  '소양인비계': {
    main:'소양인', label:'소양인 1형', fullLabel:'소양인 1형 - 비수한표한병 체질',
    hanja:'脾受寒表寒病', animal:'collie-shoes',
    desc:'비장이 한사를 받아 신음이 부족해지는 계열입니다. 수족이 냉하고 한출이 없으며 냄새 없는 방귀가 잦습니다. 찬물을 마시면 설사를 하기 쉽고물을 잘 안 마십니다(불음수). 발뒤꿈치 종렬(踵裂)이 잘 발생합니다.',
    healthy:['대변이 막힘없이 소통될 것','수족이 따뜻하게 유지될 것','방귀가 잦지 않을 것'],
    warning:['수족 냉증 심화 = 비냉 악화 신호','냉두통 발생 시 즉시 보온','발뒤꿈치 종렬 심화 주의'],
    good:['돼지고기','보리','팥','수박','오이','상추','우유','굴','해산물','파인애플'],
    bad:['닭고기','인삼','홍삼','꿀','생강','고추','찹쌀'],
    special:['찬 음식·음료 주의','발뒤꿈치 보습 및 보온 관리','냉두통 발생 시 즉시 보온']
  },
  '소양인위계': {
    main:'소양인', label:'소양인 2형', fullLabel:'소양인 2형 - 위수열이열병 체질',
    hanja:'胃受熱裏熱病', animal:'collie-wave',
    desc:'위장에 열이 쌓여 신음이 소모되는 계열입니다. 수족이 따뜻하고 손발에 땀이 잘 납니다(수족장심다한). 찬물을 많이 즐기고 자다 깨서 얼음물을 찾을 정도의 극심한 갈증을 느낍니다. 악취 나는 방귀가 특징입니다.',
    healthy:['대변이 막힘없이 소통될 것','갈증이 심하지 않을 것','수면이 안정적일 것'],
    warning:['극심한 갈증·불면·두근거림 지속 주의','대변 장기 막힘 = 위열 항진 위험','건망증+두려움(구심) 동반 시 험증'],
    good:['돼지고기','수박','참외','보리','팥','오이','상추','해산물','녹두','배'],
    bad:['닭고기','인삼','홍삼','꿀','생강','고추','매운 음식'],
    special:['서늘한 환경 유지','분노 즉시 해소','수면 전 과식 금지']
  },
  '소음인신계': {

   가중치 캡 함수 (max 기본 2)
═══════════════════════════════ */
function cap(sc, max=2) {
  const r={};
  Object.entries(sc).forEach(([k,v])=>{ r[k]=Math.min(v,max); });
  return r;
}

  {pair:['태음인위완계','소음인위계'],
   q:'땀을 흠뻑 흘리고 나면?',
   a:['개운하고 상쾌하다','기운이 빠지고 어지럽다'],
   w:['태음인위완계','소음인위계']},
  {pair:['소양인비계','소음인위계'],
   q:'대변이 굵고 짧게 나오는 편인가요?',
   a:['예, 굵고 짧게 나온다','아니오, 길게 나오거나 묽다'],
   w:['소양인비계','소음인위계']},
  {pair:['소양인위계','태음인간계'],
   q:'변비 시 어떤 증상이 주로 동반되나요?',
   a:['입안이 바짝 마르고(구조) 구취가 심해지며 가슴이 답답하다','입맛이 씁쓸하고(구고) 뒷목·어깨가 뻣팎하게 굳어온다(항강)'],
   w:['소양인위계','태음인간계']}
];

let st = {
  page:'gender', gender:null, qi:0, ans:{},
  penaltyMap:{}, sc:{}, result:null, tb:null,
  confirmedGrade:null
};

function initSc() {
  st.sc = {};
  ALL_SUBS.forEach(k => st.sc[k] = 0);
  MAINS.forEach(k => st.sc[k] = 0);
  st.penaltyMap = {};
  ALL_SUBS.forEach(k => st.penaltyMap[k] = 0);
}
initSc();

function visibleQs() {
  return QS.filter(q => !q.female || st.gender === 'female');
}

function render() {
  const area = document.getElementById('area');
  const pbar = document.getElementById('pbar');
  const vqs = visibleQs();
  if (st.page === 'gender') { pbar.style.width='0%'; renderGender(area); return; }
  if (st.page === 'start')  { pbar.style.width='0%'; renderStart(area); return; }
  if (st.page === 'q')      { pbar.style.width=Math.round((st.qi/vqs.length)*100)+'%'; renderQ(area,vqs); return; }
  if (st.page === 'tie')    { pbar.style.width='97%'; renderTie(area); return; }
  if (st.page === 'result') { pbar.style.width='100%'; renderResult(area); return; }
}

function renderGender(a) {
  a.innerHTML = `<div class="gender-card">
  <div class="si">🌿</div>
  <div class="gender-title">진단을 시작하기 전에</div>
  <div class="gender-sub">성별을 선택해주세요.<br>여성의 경우 부인과 지표가 추가되어<br>더 정밀한 진단이 가능합니다.</div>
  <div class="gender-btns">
    <button class="g-btn" onclick="setGender('male')"><div class="g-icon">👤</div>남성</button>
    <button class="g-btn" onclick="setGender('female')"><div class="g-icon">👤</div>여성</button>
  </div></div>`;
}

function setGender(g) { st.gender = g; st.page = 'start'; render(); }

function renderStart(a) {
  const vqs = visibleQs();
  a.innerHTML = `<div class="start-card">
  <div class="si">🌿</div>
  <div class="st">나를 위한 건강지도</div>
  <div class="st2">자가 진단법</div>
  <div class="sd">김주식 사상의학 임상 원전(2강·3강) 기반<br>수족온도 → 음수 → 대변 → 외형·반응 순서로 감별합니다.</div>
  <div class="sg">
    <div class="sc"><div class="sl">소요 시간</div><div class="sv">약 8~12분</div></div>
    <div class="sc"><div class="sl">문항 수</div><div class="sv">${vqs.length}문항</div></div>
    <div class="sc"><div class="sl">판정 계열</div><div class="sv">9대 세부 계열</div></div>
    <div class="sc"><div class="sl">근거</div><div class="sv">임상 원전</div></div>
  </div>
  <button class="btn-s" onclick="startQ()">진단 시작하기</button>
  <p class="disc-s">본 진단은 참고용이며 정확한 체질 판정은 반드시 한의사의 진료가 필요합니다</p>
  </div>`;
}

function startQ() { st.page='q'; st.qi=0; render(); }

function renderQ(a, vqs) {
  const q = vqs[st.qi];
  const ans = st.ans[q.id];
  const prev = st.qi > 0 ? vqs[st.qi-1].cat : null;
  const secDesc = {
    '체질 필터':'명확한 배제 조건을 확인합니다',
    '수족·한출':'원전 1순위 감별 — 수족 온도와 한출 양상',
    '음수 관계':'원전 2순위 감별 — 음수 온도·구갈 부위',
    '대변 형태':'원전 핵심 감별 — 굵기·길이·형태·동반 증상',
    '외형 지표':'안색·체형·특이 외부 지표 확인',
    '반응 지표':'음식·약재·커피·성정 반응으로 계열 확정',
    '부인과 지표':'여성 전용 — 생리 지표로 정밀도 향상'
  };
  let secHtml = q.cat !== prev ? `<div class="sec-hdr"><b>${q.cat}</b> · ${secDesc[q.cat]||''}</div>` : '';

  let vizHtml = '';
  if (q.viz === 'stool-width') {
    vizHtml = `<div class="vis-box">
      <div class="vis-label">원전 2강 19항 — 대변 굵기 비교</div>
      <div class="stool-row"><div class="stool-lbl">소양인</div><div class="stool-bar" style="height:22px;width:75%;background:#C8A882;border-radius:20px"></div><div class="stool-desc">제일 굵음</div></div>
      <div class="stool-row"><div class="stool-lbl">소음인</div><div class="stool-bar" style="height:14px;width:50%;background:#C8A882;border-radius:20px"></div><div class="stool-desc">중간</div></div>
      <div class="stool-row"><div class="stool-lbl">태음인</div><div class="stool-bar" style="height:8px;width:28%;background:#C8A882;border-radius:20px"></div><div class="stool-desc">제일 가늘음</div></div>
    </div>`;
  } else if (q.viz === 'stool-length') {
    vizHtml = `<div class="vis-box">
      <div class="vis-label">원전 2강 19항 — 대변 길이 비교</div>
      <div class="stool-row"><div class="stool-lbl">소음인</div><div class="stool-bar" style="height:12px;width:80%;background:#A8856A;border-radius:20px"></div><div class="stool-desc">제일 길음</div></div>
      <div class="stool-row"><div class="stool-lbl">태음인</div><div class="stool-bar" style="height:12px;width:52%;background:#A8856A;border-radius:20px"></div><div class="stool-desc">중간</div></div>
      <div class="stool-row"><div class="stool-lbl">소양인</div><div class="stool-bar" style="height:12px;width:30%;background:#A8856A;border-radius:20px"></div><div class="stool-desc">제일 짧음</div></div>
    </div>`;
  } else if (q.viz === 'costal' || q.viz === 'body-type') {
    vizHtml = `<div class="img-placeholder">
      <div class="img-ph-icon">🖼</div>
      <div class="img-ph-text">이미지 플레이스홀더 — 한의원 맞춤 일러스트 삽입 영역</div>
    </div>`;
  }

  let body = '';
  if (q.type === 'bool') {
    body = `<div class="bool-r">
    <button class="bbtn${ans==='yes'?' yes':''}" onclick="aBool('yes')">예, 그렇습니다</button>
    <button class="bbtn${ans==='no'?' no':''}" onclick="aBool('no')">아니오</button>
    </div>`;
  } else {
    body = `<div class="opts">` + q.opts.map((o,i) =>
      `<button class="opt${ans===i?' sel':''}" onclick="aCh(${i})"><div class="odot"></div><span>${o.t}</span></button>`
    ).join('') + `</div>`;
  }

  a.innerHTML = secHtml + `<div class="q-card">
  <div class="q-badge" style="background:${q.col||'#7A9E7E'}">${q.cat}</div>
  <div class="q-num">문항 ${st.qi+1} / ${vqs.length}</div>
  <div class="q-text">${q.text}</div>
  ${q.hint ? `<div class="q-hint">${q.hint}</div>` : ''}
  ${vizHtml}${body}
  <div class="nav">
    <button class="btn-b" onclick="goBack()" ${st.qi===0?'disabled':''}>← 이전</button>
    <button class="btn-n" onclick="goNext()" ${ans!==undefined?'':'disabled'}>${st.qi===vqs.length-1?'결과 보기':'다음 →'}</button>
  </div></div>`;
}

function aBool(v) {
  const vqs = visibleQs();
  const q = vqs[st.qi]; st.ans[q.id] = v;
  renderQ(document.getElementById('area'), vqs);
  setTimeout(() => goNext(), 300);
}

function aCh(i) {
  const vqs = visibleQs();
  st.ans[vqs[st.qi].id] = i;
  renderQ(document.getElementById('area'), vqs);
}

function goBack() { if (st.qi > 0) { st.qi--; render(); } }

function goNext() {
  const vqs = visibleQs();
  const q = vqs[st.qi];
  if (st.ans[q.id] === undefined) return;
  if (st.qi < vqs.length - 1) { st.qi++; render(); }
  else calcFinal();
}

function applyScore(sc) {
  if (!sc) return;
  Object.entries(sc).forEach(([k,v]) => {
    if (st.sc[k] !== undefined) st.sc[k] += v;
    MAINS.forEach(m => {
      if (k.startsWith(m) && m !== k && st.sc[m] !== undefined) st.sc[m] += v * 0.4;
    });
  });
}

function applyPenalty(mainKey) {
  const targets = MAIN_MAP[mainKey] || [];
  targets.forEach(sub => {
    st.penaltyMap[sub] = (st.penaltyMap[sub] || 0) + FILTER_PENALTY;
  });
}

function calcFinal() {
  initSc();
  const vqs = visibleQs();
  const skippedWfIds = new Set();

  vqs.forEach(q => {
    const a = st.ans[q.id];
    if (a === undefined) return;

    if (q.type === 'bool') {
      const eff = a === 'yes' ? q.yes : q.no;
      if (!eff) return;
      if (eff.penalty) applyPenalty(eff.penalty);
      if (eff.sc) applyScore(eff.sc);
    } else {
      const opt = q.opts[a];
      if (!opt) return;
      if (opt.skip) {
        if (q.female) skippedWfIds.add(q.id);
        return;
      }
      if (opt.sc) applyScore(opt.sc);
      if (opt.bonus) applyScore(opt.bonus);
    }
  });

  ALL_SUBS.forEach(k => {
    if (st.penaltyMap[k]) st.sc[k] += st.penaltyMap[k];
  });

  if (st.gender === 'female' && skippedWfIds.size > 0) {
    const wfActual = {};
    ALL_SUBS.forEach(k => { wfActual[k] = 0; });
    const wfMaxAchievable = {};
    ALL_SUBS.forEach(k => { wfMaxAchievable[k] = 0; });
    const wfTotalMax = {};
    ALL_SUBS.forEach(k => { wfTotalMax[k] = 0; });

    Object.entries(WF_MAX_SCORES).forEach(([qid, maxMap]) => {
      Object.entries(maxMap).forEach(([sub, maxPt]) => {
        if (wfTotalMax[sub] !== undefined) wfTotalMax[sub] += maxPt;
        if (!skippedWfIds.has(qid) && wfMaxAchievable[sub] !== undefined) {
          wfMaxAchievable[sub] += maxPt;
        }
      });
    });

    vqs.forEach(q => {
      if (!q.female || skippedWfIds.has(q.id)) return;
      const a = st.ans[q.id];
      if (a === undefined) return;
      const opt = q.opts[a];
      if (!opt || opt.skip) return;
      if (opt.sc) {
        Object.entries(opt.sc).forEach(([k, v]) => {
          if (wfActual[k] !== undefined) wfActual[k] += v;
        });
      }
      if (opt.bonus) {
        Object.entries(opt.bonus).forEach(([k, v]) => {
          if (wfActual[k] !== undefined) wfActual[k] += v;
        });
      }
    });

    ALL_SUBS.forEach(k => {
      const achievable = wfMaxAchievable[k];
      const totalMax   = wfTotalMax[k];
      if (achievable > 0 && totalMax > 0) {
        const ratio = wfActual[k] / achievable;
        const rawWfScore = wfActual[k];
        const correctedScore = ratio * totalMax;
        st.sc[k] = st.sc[k] - rawWfScore + correctedScore;
      }
    });
  }

  ALL_SUBS.forEach(k => { st.sc[k] = Math.max(0, st.sc[k]); });

  const sorted = ALL_SUBS.map(k => ({k, v:st.sc[k]})).sort((a,b) => b.v - a.v);
  const top1 = sorted[0], top2 = sorted[1];
  const diff = top1.v - top2.v;

  if (diff <= 5) {
    if (diff >= 3) st.confirmedGrade = 'C';
    else st.confirmedGrade = 'D';
  } else {
    st.confirmedGrade = null;
  }

  if (diff > 5) {
    st.result = top1.k;
    st.page = 'result';
    render();
    return;
  }

  const tb = TBS.find(t =>
    (t.pair[0]===top1.k && t.pair[1]===top2.k) ||
    (t.pair[0]===top2.k && t.pair[1]===top1.k)
  );

  if (tb) {
    st.tb = {...tb, top1:top1.k, top2:top2.k};
    st.page = 'tie';
    render();
    return;
  }

  const physIds = ['h1','h2','h3','h4','h5','w1','w2','w3'];
  const physScore = (key) => {
    let s = 0;
    vqs.forEach(q => {
      if (!physIds.includes(q.id)) return;
      const a = st.ans[q.id]; if (a===undefined) return;
      if (q.type==='bool') {
        const eff = (a==='yes'?q.yes:q.no);
        if (eff&&eff.sc&&eff.sc[key]) s += eff.sc[key];
      } else {
        const opt = q.opts[a];
        if (opt&&opt.sc&&opt.sc[key]) s += opt.sc[key];
      }
    });
    return s;
  };
  const p1 = physScore(top1.k), p2 = physScore(top2.k);
  if (p1 !== p2) {
    st.result = p1 > p2 ? top1.k : top2.k;
  } else {
    const main1 = MAINS.find(m => top1.k.startsWith(m));
    const main2 = MAINS.find(m => top2.k.startsWith(m));
    st.result = (st.sc[main1]||0) >= (st.sc[main2]||0) ? top1.k : top2.k;
  }
  st.page = 'result';
  render();
}

function renderTie(a) {
  const tb = st.tb;
  const l1 = SUBS[tb.top1]?.label||tb.top1;
  const l2 = SUBS[tb.top2]?.label||tb.top2;
  a.innerHTML = `<div class="tie-card">
  <div class="tie-eye">최종 판정 질문</div>
  <div class="tie-t">두 계열이 근소한 차이입니다</div>
  <div class="tie-s">${l1} / ${l2}<br>추가 질문으로 최종 계열을 확정합니다.</div>
  <div class="tie-q">${tb.q}</div>
  <div class="opts">
    <button class="opt" onclick="resolveTie(0)"><div class="odot"></div><span>${tb.a[0]}</span></button>
    <button class="opt" onclick="resolveTie(1)"><div class="odot"></div><span>${tb.a[1]}</span></button>
  </div></div>`;
}

function resolveTie(i) {
  st.result = ALL_SUBS.includes(st.tb.w[i]) ? st.tb.w[i] : st.tb.top1;
  st.page = 'result';
  render();
}

function renderResult(a) {
  const rk = st.result;
  const d = SUBS[rk];

  // ── 환자 응답 데이터 수집 ──────────────────────────────
  const SHEET_URL = 'https://script.google.com/macros/s/AKfycbzX6NouJw3s5evArwuxF1CDRWWnYNdGRng7iX0RlScckiy9F_7FfSC1B_74UII9HOdjhQ/exec';
  fetch(SHEET_URL, {
    method: 'POST',
    body: JSON.stringify({
      gender : st.gender,
      result : st.result,
      grade  : st.confirmedGrade || 'A',
      scores : st.sc,
      answers: st.ans
    })
  }).catch(() => {});
  // ────────────────────────────────────────────────────
  const col = MAIN_COL[d.main] || '#7A9E7E';

  const sorted = ALL_SUBS.map(k=>({k,v:st.sc[k]})).sort((a,b)=>b.v-a.v);
  const diff = sorted[0].v - sorted[1].v;

  let grade, gaugePercent, gaugeColor, gradeMsg, gradeSub;
  const effectiveGrade = st.confirmedGrade || null;

  if (effectiveGrade === 'C') {
    grade='C'; gaugePercent=40; gaugeColor='#C8B89A';
    gradeMsg='진단 확신도: 보통'; gradeSub='두 계열의 특성이 혼재되어 있습니다.';
  } else if (effectiveGrade === 'D') {
    grade='D'; gaugePercent=15; gaugeColor='#E8A87C';
    gradeMsg='진단 확신도: 혼합형'; gradeSub='추가 면담이 필요합니다.';
  } else {
    if (diff >= 10) {
      grade='A'; gaugePercent=90; gaugeColor='#4E7053';
      gradeMsg='진단 확신도: 매우 높음'; gradeSub='체질 특성이 뚜렷하게 나타났습니다.';
    } else if (diff >= 6) {
      grade='B'; gaugePercent=70; gaugeColor='#7A9E7E';
      gradeMsg='진단 확신도: 높음'; gradeSub='체질 특성이 비교적 명확하게 나타났습니다.';
    } else if (diff >= 3) {
      grade='C'; gaugePercent=40; gaugeColor='#C8B89A';
      gradeMsg='진단 확신도: 보통'; gradeSub='두 계열의 특성이 혼재되어 있습니다.';
    } else {
      grade='D'; gaugePercent=15; gaugeColor='#E8A87C';
      gradeMsg='진단 확신도: 혼합형'; gradeSub='추가 면담이 필요합니다.';
    }
  }

  const arcSvg = buildArcGauge(gaugePercent, gaugeColor, grade);
  const emblemSvg = buildEmblem(d.animal, col);

  const top6 = sorted.slice(0,6);
  const mx = top6[0].v || 1;
  const bars = top6.map(it => {
    const pct = Math.round((it.v/mx)*100);
    const isTop = it.k === rk;
    return `<div class="sc-row">
    <div class="sc-nm" style="${isTop?'font-weight:600;color:'+col:''}">${SUBS[it.k]?.label||it.k}</div>
    <div class="sc-tr"><div class="sc-fi" style="width:${pct}%;background:${isTop?col:'#C8B89A'}"></div></div>
    <div class="sc-vl" style="color:${isTop?col:'var(--text-light)'}">${it.v.toFixed(1)}</div></div>`;
  }).join('');

  const healthItems = d.healthy.map(s=>`<div class="h-item"><span class="h-dot">✓</span><span>${s}</span></div>`).join('');
  const warnItems = d.warning.map(s=>`<div class="w-item"><span class="w-dot">⚠</span><span>${s}</span></div>`).join('');
  const specs = d.special.map(s=>`<div class="sp-item"><span class="sp-dot">·</span><span>${s}</span></div>`).join('');

  a.innerHTML = `<div class="res-wrap">
  <div class="res-gauge-section">
    ${arcSvg}
    <div class="gauge-grade" style="color:${gaugeColor}">${gradeMsg}</div>
    <div class="gauge-msg">${grade}등급</div>
    <div class="gauge-sub">${gradeSub}</div>
  </div>

  <div class="res-emblem-section">
    <div class="emblem-wrap">${emblemSvg}</div>
    <div class="res-main-type" style="color:${col}">${d.main}</div>
    <div class="res-sub-type">${d.fullLabel}</div>
    <div class="res-hanja">${d.hanja}</div>
    <div class="res-desc">${d.desc}</div>
  </div>

  <div class="score-section">
    <div class="sec-l">계열별 점수 분포 (상위 6위)</div>${bars}
  </div>

  <div class="cards-row">
    <div class="info-card">
      <div class="card-title">완실무병의 조건</div>
      ${healthItems}
      <div style="height:10px"></div>
      <div style="font-size:10px;letter-spacing:1px;color:var(--text-light);margin-bottom:8px">위기 징후</div>
      ${warnItems}
    </div>
    <div class="info-card">
      <div class="card-title" style="color:#8B4A3A">체질별 득(得)과 실(失)</div>
      <div class="food-grid">
        <div class="food-card good">
          <div class="fc-t">✓ 이로운 음식</div>
          <div class="ftags">${d.good.map(f=>`<span class="ftag">${f}</span>`).join('')}</div>
        </div>
        <div class="food-card bad">
          <div class="fc-t">✗ 금기 음식</div>
          <div class="ftags">${d.bad.map(f=>`<span class="ftag">${f}</span>`).join('')}</div>
        </div>
      </div>
    </div>
  </div>

  <div class="sp-section">
    <div class="sec-l">생활 관리 포인트</div>${specs}
  </div>

  <button class="btn-r" onclick="restart()">↩ 처음으로 돌아가기</button>
  <div class="disc">⚕ 본 진단은 참고용이며 정확한 체질 판정은 반드시 한의사의 진료를 받으시기 바랍니다.<br>동일 환자라도 상태에 따라 계열이 달라 보일 수 있으므로 임상 전문가의 확인이 필요합니다.</div>
  </div>`;
}

function buildArcGauge(pct, color, grade) {
  const r = 80, cx = 120, cy = 110;
  const startAngle = Math.PI;
  const endAngle = Math.PI + (pct / 100) * Math.PI;
  const x1 = cx + r * Math.cos(startAngle), y1 = cy + r * Math.sin(startAngle);
  const x2 = cx + r * Math.cos(endAngle),   y2 = cy + r * Math.sin(endAngle);
  const large = pct > 50 ? 1 : 0;
  const needleAngle = Math.PI + (pct / 100) * Math.PI;
  const nx = cx + (r-8) * Math.cos(needleAngle), ny = cy + (r-8) * Math.sin(needleAngle);
  return `<svg viewBox="0 0 240 120" width="240" height="120" style="overflow:visible;margin:0 auto;display:block">
    <path d="M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}" fill="none" stroke="#E8DFD0" stroke-width="14" stroke-linecap="round"/>
    <path d="M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="${color}" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="5" fill="${color}"/>
    <text x="${cx}" y="${cy}" text-anchor="middle" font-size="22" font-weight="600" fill="${color}" font-family="Noto Serif KR,serif" dy="-14">${grade}</text>
  </svg>`;
}

function buildEmblem(animal, col) {
  const emojis = {
    'cat-scarf':'🧣🐱','cat-thunder':'⚡🐱','cat-ice':'🧊🐱',
    'bear-snow':'❄️🐻','bear-fire':'🔥🐻',
    'collie-shoes':'🧦🐕','collie-wave':'🌊🐕',
    'eagle-mountain':'⛰️🦅','eagle-leaf':'🌿🦅'
  };
  const label = emojis[animal] || '🌿';
  return `<div style="width:100px;height:100px;background:linear-gradient(135deg,${col}22,${col}11);border:1.5px solid ${col}44;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto">${label}</div>`;
}

function restart() {
  st = {
    page:'gender', gender:null, qi:0, ans:{},
    penaltyMap:{}, sc:{}, result:null, tb:null,
    confirmedGrade:null
  };
  initSc();
  render();
}

render();
</script>
